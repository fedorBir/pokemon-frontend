server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The backend, reached through this server so the browser needs no second address.
    location /api/ {
        proxy_pass http://main_app_pokemon-backend:3001;
    }

    # Single Page App (client-side routing) support.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
